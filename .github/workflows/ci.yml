name: Python package, lint, test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uvx flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uvx flake8 . --count --exit-zero --max-complexity=11 --max-line-length=127 --statistics

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      # fail-fast: false
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Install package and all dependencies
      run: |
        #if [ "${{ matrix.python-version }}" == "3.14" ]; then
          # nightly onnxruntime build supports python 3.14 (https://github.com/microsoft/onnxruntime/issues/26547)
          #uv pip install flatbuffers "numpy==2.2.6" packaging protobuf sympy
          #uv pip install --pre --index-url https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ORT-Nightly/pypi/simple/ onnxruntime
        #fi
        # editable install, replaces `flit install --symlink`; requires numpy-2.2.6 for python 3.14
        uv pip install -e ".[dev]"
        uv pip freeze
    - name: Install ExifTool
      run: |
        sudo apt-get update
        sudo apt-get install -y libimage-exiftool-perl
    - name: Test with pytest
      run: pytest
